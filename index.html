<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARDIOPULM ASSESSMENT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
        }

        .monitor-container {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            height: 100vh;
            width: 100vw;
            gap: 2px;
            background: #111;
            position: fixed;
            top: 0;
            left: 0;
        }

        .bed-panel {
            background: #000;
            position: relative;
            border: 2px solid #333;
            cursor: pointer;
            transition: border-color 0.2s;
            overflow: hidden;
            min-height: 0;
        }

        .bed-panel:hover {
            border-color: #555;
        }

        .bed-panel.active {
            border-color: #00ff00;
        }

        .bed-header {
            position: absolute;
            top: 10px;
            left: 15px;
            color: #00ff00;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 0 10px #00ff00;
        }

        .hr-display {
            display: none;
        }

        .ecg-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .slider-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .slider-overlay.show {
            display: flex;
        }

        .slider-panel {
            background: #1a1a1a;
            border: 3px solid #00ff00;
            border-radius: 10px;
            padding: 30px 40px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }

        .slider-title {
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px #00ff00;
        }

        .slider-container {
            margin: 20px 0;
        }

        .slider-label {
            color: #00ff00;
            font-size: 18px;
            margin-bottom: 10px;
            text-align: center;
        }

        .hr-slider {
            width: 300px;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            outline: none;
            border-radius: 5px;
        }

        .hr-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            background: #00ff00;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
        }

        .hr-slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            background: #00ff00;
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 10px #00ff00;
        }

        .close-button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .close-button:hover {
            background: #00dd00;
        }
    </style>
</head>
<body>
    <div class="monitor-container">
        <div class="bed-panel" data-bed="1">
            <div class="bed-header">BED 1</div>
            <div class="hr-display" id="hr-display-1">75 bpm</div>
            <canvas class="ecg-canvas" id="canvas-1"></canvas>
        </div>
        <div class="bed-panel" data-bed="2">
            <div class="bed-header">BED 2</div>
            <div class="hr-display" id="hr-display-2">75 bpm</div>
            <canvas class="ecg-canvas" id="canvas-2"></canvas>
        </div>
        <div class="bed-panel" data-bed="3">
            <div class="bed-header">BED 3</div>
            <div class="hr-display" id="hr-display-3">75 bpm</div>
            <canvas class="ecg-canvas" id="canvas-3"></canvas>
        </div>
        <div class="bed-panel" data-bed="4">
            <div class="bed-header">BED 4</div>
            <div class="hr-display" id="hr-display-4">75 bpm</div>
            <canvas class="ecg-canvas" id="canvas-4"></canvas>
        </div>
    </div>

    <div class="slider-overlay" id="slider-overlay">
        <div class="slider-panel">
            <div class="slider-title" id="slider-title">Adjust Heart Rate - BED 1</div>
            <div class="slider-container">
                <div class="slider-label" id="current-hr-label">75 bpm</div>
                <input type="range" min="30" max="180" value="75" class="hr-slider" id="hr-slider">
            </div>
            <button class="close-button" id="close-button">Close</button>
        </div>
    </div>

    <script>
        class ECGMonitor {
            constructor(canvasId, bedNumber) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.bedNumber = bedNumber;
                this.heartRate = 75;
                this.scrollSpeed = 2;
                this.scrollPosition = 0;
                this.ecgColor = '#00ff00';
                this.backgroundColor = '#000';
                this.gridColor = '#003300';
                
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                this.canvas.width = this.canvas.offsetWidth;
                this.canvas.height = this.canvas.offsetHeight;
            }

            generateECGWaveform(width) {
                const beatsPerMinute = this.heartRate;
                const pixelsPerSecond = 100;
                const beatDuration = (60 / beatsPerMinute) * pixelsPerSecond;
                
                // QRS is fixed — doesn't change with heart rate
                const qrsWidth = 9;     // 90ms (normal 60-100ms)
                
                // All other components scale down as HR increases.
                // Reference values are at 75 bpm where available = 71px.
                const available = beatDuration - qrsWidth;
                const scaleFactor = Math.min(1, available / 71);
                
                // Each component has a reference width and a minimum floor
                const pWidth  = Math.max(6, 10 * scaleFactor);   // 100ms ref, 60ms floor
                const prGap   = Math.max(4,  8 * scaleFactor);   //  80ms ref, 40ms floor
                const stGap   = Math.max(2,  8 * scaleFactor);   //  80ms ref, 20ms floor
                const tWidth  = Math.max(8, 18 * scaleFactor);   // 180ms ref, 80ms floor
                
                const complexWidth = pWidth + prGap + qrsWidth + stGap + tWidth;
                // TP baseline absorbs the most compression (diastole shortens first)
                const tpBaseline = Math.max(1, beatDuration - complexWidth);
                const actualBeatWidth = complexWidth + tpBaseline;
                
                const numBeats = Math.ceil(width / actualBeatWidth) + 3;
                const totalPoints = Math.ceil(numBeats * actualBeatWidth);
                const points = [];
                const baseline = this.canvas.height / 2;
                
                for (let i = 0; i < totalPoints; i++) {
                    const posInBeat = i % actualBeatWidth;
                    let y = baseline;
                    
                    // Center the PQRST complex within the beat
                    const pStart   = tpBaseline * 0.5;
                    const prStart  = pStart + pWidth;
                    const qrsStart = prStart + prGap;
                    const stStart  = qrsStart + qrsWidth;
                    const tStart   = stStart + stGap;
                    const tEnd     = tStart + tWidth;
                    
                    if (posInBeat >= pStart && posInBeat < prStart) {
                        // P wave
                        const progress = (posInBeat - pStart) / pWidth;
                        y -= 8 * Math.sin(progress * Math.PI);
                    }
                    else if (posInBeat >= qrsStart && posInBeat < stStart) {
                        // QRS complex
                        const pos = (posInBeat - qrsStart) / qrsWidth;
                        
                        if (pos < 0.15) {
                            // Q wave
                            y += 12 * (pos / 0.15);
                        } else if (pos < 0.45) {
                            // R wave
                            const rProgress = (pos - 0.15) / 0.30;
                            y -= 60 * Math.sin(rProgress * Math.PI);
                        } else if (pos < 0.55) {
                            // S wave — tighter downstroke
                            const sProgress = (pos - 0.45) / 0.10;
                            y += 20 * Math.sin(sProgress * Math.PI);
                        } else {
                            // Smooth return to baseline
                            const returnProgress = (pos - 0.55) / 0.45;
                            y += 20 * (1 - returnProgress) * (1 - returnProgress);
                        }
                    }
                    else if (posInBeat >= tStart && posInBeat < tEnd) {
                        // T wave
                        const progress = (posInBeat - tStart) / tWidth;
                        y -= 15 * Math.sin(progress * Math.PI);
                    }
                    
                    points.push({ x: i, y: y });
                }
                
                return points;
            }

            drawGrid() {
                const smallSquare = 4;    // 4px = 0.04s at 100px/s (matches real ECG 1mm squares)
                const largeSquare = smallSquare * 5;  // 20px = 0.2s (matches real ECG 5mm squares)
                
                this.ctx.strokeStyle = this.gridColor;
                this.ctx.lineWidth = 0.5;
                
                // Draw small squares
                for (let x = 0; x < this.canvas.width; x += smallSquare) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }
                
                for (let y = 0; y < this.canvas.height; y += smallSquare) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width, y);
                    this.ctx.stroke();
                }
                
                // Draw large squares
                this.ctx.lineWidth = 1;
                for (let x = 0; x < this.canvas.width; x += largeSquare) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }
                
                for (let y = 0; y < this.canvas.height; y += largeSquare) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width, y);
                    this.ctx.stroke();
                }
            }

            draw() {
                // Clear canvas
                this.ctx.fillStyle = this.backgroundColor;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Draw grid
                this.drawGrid();
                
                // Generate and draw static ECG waveform
                const waveform = this.generateECGWaveform(this.canvas.width);
                
                this.ctx.strokeStyle = this.ecgColor;
                this.ctx.lineWidth = 2;
                this.ctx.shadowBlur = 3;
                this.ctx.shadowColor = this.ecgColor;
                this.ctx.beginPath();
                
                // Draw static waveform - no scrolling offset
                for (let i = 0; i < this.canvas.width; i++) {
                    const dataIndex = i % waveform.length;
                    const point = waveform[dataIndex];
                    if (i === 0) {
                        this.ctx.moveTo(i, point.y);
                    } else {
                        this.ctx.lineTo(i, point.y);
                    }
                }
                
                this.ctx.stroke();
                this.ctx.shadowBlur = 0;
                
                // Draw scrolling black bar to create illusion of movement
                const barWidth = 30;
                const barPosition = this.scrollPosition % this.canvas.width;
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(barPosition, 0, barWidth, this.canvas.height);
                
                // Update scroll position
                this.scrollPosition += this.scrollSpeed;
            }

            setHeartRate(hr) {
                this.heartRate = hr;
            }
        }

        // Initialize monitors
        const monitors = [
            new ECGMonitor('canvas-1', 1),
            new ECGMonitor('canvas-2', 2),
            new ECGMonitor('canvas-3', 3),
            new ECGMonitor('canvas-4', 4)
        ];

        // Animation loop
        function animate() {
            monitors.forEach(monitor => monitor.draw());
            requestAnimationFrame(animate);
        }
        animate();

        // Slider controls
        let currentBed = null;
        const sliderOverlay = document.getElementById('slider-overlay');
        const slider = document.getElementById('hr-slider');
        const sliderTitle = document.getElementById('slider-title');
        const currentHrLabel = document.getElementById('current-hr-label');
        const closeButton = document.getElementById('close-button');

        document.querySelectorAll('.bed-panel').forEach(panel => {
            panel.addEventListener('click', (e) => {
                e.stopPropagation();
                const bedNumber = parseInt(panel.dataset.bed);
                currentBed = bedNumber;
                const monitor = monitors[bedNumber - 1];
                
                sliderTitle.textContent = `Adjust Heart Rate - BED ${bedNumber}`;
                slider.value = monitor.heartRate;
                currentHrLabel.textContent = `${monitor.heartRate} bpm`;
                sliderOverlay.classList.add('show');
                
                // Highlight active panel
                document.querySelectorAll('.bed-panel').forEach(p => p.classList.remove('active'));
                panel.classList.add('active');
            });
        });

        slider.addEventListener('input', (e) => {
            const hr = parseInt(e.target.value);
            currentHrLabel.textContent = `${hr} bpm`;
            if (currentBed !== null) {
                monitors[currentBed - 1].setHeartRate(hr);
            }
        });

        closeButton.addEventListener('click', () => {
            sliderOverlay.classList.remove('show');
            document.querySelectorAll('.bed-panel').forEach(p => p.classList.remove('active'));
            currentBed = null;
        });

        sliderOverlay.addEventListener('click', (e) => {
            if (e.target === sliderOverlay) {
                sliderOverlay.classList.remove('show');
                document.querySelectorAll('.bed-panel').forEach(p => p.classList.remove('active'));
                currentBed = null;
            }
        });
    </script>
</body>
</html>
